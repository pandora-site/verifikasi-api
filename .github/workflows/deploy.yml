# ============================================================
# CLOUDFLARE WORKER DEPLOYMENT - VERSI MAKSIMAL
# ============================================================

name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'src/**'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version tag (optional)'
        required: false
        type: string

# ============================================================
# PERMISSIONS
# ============================================================
permissions:
  contents: read
  deployments: write
  statuses: write

# ============================================================
# JOBS
# ============================================================
jobs:
  # ============================================================
  # TEST & LINT
  # ============================================================
  test:
    runs-on: ubuntu-latest
    name: Test & Lint
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ============================================================
  # BUILD
  # ============================================================
  build:
    runs-on: ubuntu-latest
    name: Build Worker
    needs: test
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worker-build
          path: |
            src/
            wrangler.toml
            package.json
          retention-days: 1

  # ============================================================
  # DEPLOY STAGING
  # ============================================================
  deploy-staging:
    runs-on: ubuntu-latest
    name: Deploy to Staging
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/staging') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: 
      name: staging
      url: https://staging.verifikasi.site
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: worker-build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --env staging

      - name: Set Staging Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.PASSWORD_STAGING }}" | wrangler secret put PASSWORD --env staging

  # ============================================================
  # DEPLOY PRODUCTION
  # ============================================================
  deploy-production:
    runs-on: ubuntu-latest
    name: Deploy to Production
    needs: deploy-staging
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: 
      name: production
      url: https://verifikasi.site
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: worker-build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --env production

      - name: Set Production Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.PASSWORD }}" | wrangler secret put PASSWORD --env production

      - name: Create Version Tag
        if: github.event.inputs.version != ''
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ github.event.inputs.version }}'
            const tag = `v${version}`
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha
            })

      - name: Create Deployment Status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ github.event.deployment.id || 0 }},
              state: 'success',
              environment_url: 'https://verifikasi.site'
            })

  # ============================================================
  # ROLLBACK
  # ============================================================
  rollback:
    runs-on: ubuntu-latest
    name: Rollback
    needs: deploy-production
    if: failure()
    environment: 
      name: production
      url: https://verifikasi.site
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Rollback to Previous Version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Get previous version
          PREVIOUS_VERSION=$(wrangler deployments list --env production --json | jq -r '.[1].id')
          wrangler rollback --env production $PREVIOUS_VERSION

      - name: Notify Rollback
        uses: actions/github-script@v7
        with:
          script: |
            const message = '🚨 Rollback to previous version completed!'
            console.log(message)

  # ============================================================
  # NOTIFICATIONS
  # ============================================================
  notify-success:
    runs-on: ubuntu-latest
    name: Notify Success
    needs: [deploy-production, deploy-staging]
    if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    
    steps:
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Deploy Success!
            
            Repository: ${{ github.repository }}
            Environment: ${{ github.event.inputs.environment || 'auto' }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            
            URL: https://verifikasi.site

      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        if: secrets.DISCORD_WEBHOOK != ''
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          title: "Deploy Success"
          description: |
            Repository: ${{ github.repository }}
            Environment: ${{ github.event.inputs.environment || 'auto' }}
            Branch: ${{ github.ref_name }}
            URL: https://verifikasi.site

  notify-failure:
    runs-on: ubuntu-latest
    name: Notify Failure
    needs: [deploy-production, deploy-staging, rollback]
    if: failure()
    
    steps:
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ Deploy Failed!
            
            Repository: ${{ github.repository }}
            Environment: ${{ github.event.inputs.environment || 'auto' }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            
            Check GitHub Actions for details.

      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        if: secrets.DISCORD_WEBHOOK != ''
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: "Deploy Failed"
          description: |
            Repository: ${{ github.repository }}
            Environment: ${{ github.event.inputs.environment || 'auto' }}
            Branch: ${{ github.ref_name }}
